<!DOCTYPE html>
<html lang="uz">
	<head>
		<meta charset="UTF-8" />
		<!--
		  user-scalable=no prevents pinch-zoom inside the Telegram WebApp iframe,
		  which is standard practice for Mini Apps.
		-->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<meta name="theme-color" content="#16a34a" />
		<title>Namoz Yo'riqnomasi</title>

		<!--
		  Telegram Mini App SDK — must load before the app bundle so
		  window.Telegram.WebApp is available at module init time.
		  https://core.telegram.org/bots/webapps
		-->
		<script src="https://telegram.org/js/telegram-web-app.js"></script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
